<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }} — GPU &amp; Embedded Systems{% endif %}</title>
<meta name="description" content="{{ page.excerpt | default: site.description | strip_html | strip_newlines | truncate: 160 }}">
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
<script>
  // Runs before first paint to prevent a wrong-theme flash (FOUC).
  (function () {
    var p = localStorage.getItem("theme") || "auto";
    var dark = matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.dataset.theme = p === "auto" ? (dark ? "dark" : "light") : p;
  })();
</script>
</head>
<body>

<nav class="nav">
  <a class="brand" href="{{ '/' | relative_url }}">tanya-sriv</a>
  <ul>
    <li><a href="{{ '/' | relative_url }}" {% if page.url == '/' %}class="active"{% endif %}>~/home</a></li>
    <li><a href="{{ '/#projects' | relative_url }}">projects</a></li>
    <li><a href="{{ '/blog/' | relative_url }}" {% if page.url contains '/blog' %}class="active"{% endif %}>blog</a></li>
    <li><a href="{{ '/about/' | relative_url }}" {% if page.url contains '/about' %}class="active"{% endif %}>about</a></li>
    <li><button class="theme-btn" aria-label="Toggle color theme">◐ auto</button></li>
  </ul>
</nav>

{{ content }}

<footer class="footer">
  <div class="inner">
    <div>
      <a href="{{ site.author.github }}">github</a>
      <a href="{{ site.author.linkedin }}">linkedin</a>
      <a href="mailto:{{ site.author.email }}">email</a>
    </div>
    <div>© {{ site.time | date: "%Y" }} {{ site.author.name }}</div>
  </div>
</footer>

<script src="{{ '/assets/js/main.js' | relative_url }}"></script>
{% if site.goatcounter and site.goatcounter != "" %}
<script data-goatcounter="https://{{ site.goatcounter }}.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
{% endif %}
</body>
</html>
