<!-- "Capsule-bot": original mascot. Floats idle, ROLLS along the bottom of the
     page every so often (wheel-physics rotation), jumps + speaks on click.
     Structure: .mascot = JS-driven position (roaming), .mascot-inner = CSS
     float/jump animations, svg = rolling rotation. Separate layers so the
     transforms never fight. -->
<div class="mascot" id="mascot" title="beep boop" aria-hidden="true">
  <div class="mascot-inner">
  <svg viewBox="0 0 120 150" width="80" height="100" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <clipPath id="mascot-body"><rect x="22" y="28" width="76" height="100" rx="38"/></clipPath>
    </defs>
    <!-- wispy burgundy hair -->
    <g stroke="#7a2f3e" stroke-width="3.2" stroke-linecap="round" fill="none">
      <path d="M52 30 Q48 20 42 16"/>
      <path d="M57 28 Q56 16 52 10"/>
      <path d="M62 28 Q63 15 66 9"/>
      <path d="M68 30 Q72 19 78 15"/>
      <path d="M60 29 Q60 20 60 13"/>
    </g>
    <!-- arms -->
    <path d="M22 82 q-12 6 -10 18" stroke="#8a929c" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M98 82 q12 6 10 18" stroke="#8a929c" stroke-width="7" fill="none" stroke-linecap="round"/>
    <!-- capsule body -->
    <rect x="22" y="28" width="76" height="100" rx="38" fill="#f5c518" stroke="#3a3f45" stroke-width="4"/>
    <!-- goggle strap -->
    <rect x="22" y="52" width="76" height="10" fill="#3a3f45"/>
    <!-- goggle lens (single, camera-style) -->
    <circle cx="60" cy="57" r="19" fill="#c8cdd3" stroke="#3a3f45" stroke-width="4"/>
    <circle cx="60" cy="57" r="12" fill="#ffffff" stroke="#3a3f45" stroke-width="3"/>
    <circle cx="60" cy="57" r="5" fill="#22272e" class="pupil"/>
    <circle cx="62.5" cy="54.5" r="1.8" fill="#fff"/>
    <!-- smile -->
    <path d="M48 84 Q60 92 72 84" stroke="#3a3f45" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- teal overalls -->
    <g clip-path="url(#mascot-body)">
      <rect x="18" y="104" width="84" height="26" fill="#14606f"/>
      <rect x="45" y="92" width="30" height="14" rx="3" fill="#14606f"/>
      <rect x="52" y="96" width="16" height="8" rx="2" fill="none" stroke="#4d97a6" stroke-width="2"/>
    </g>
    <line x1="47" y1="95" x2="27" y2="80" stroke="#14606f" stroke-width="6" stroke-linecap="round"/>
    <line x1="73" y1="95" x2="93" y2="80" stroke="#14606f" stroke-width="6" stroke-linecap="round"/>
    <circle cx="48" cy="95" r="2.6" fill="#e8b64c"/>
    <circle cx="72" cy="95" r="2.6" fill="#e8b64c"/>
    <rect x="22" y="28" width="76" height="100" rx="38" fill="none" stroke="#3a3f45" stroke-width="4"/>
    <!-- boots -->
    <rect x="34" y="126" width="18" height="14" rx="5" fill="#57606a"/>
    <rect x="68" y="126" width="18" height="14" rx="5" fill="#57606a"/>
  </svg>
  </div>
</div>
